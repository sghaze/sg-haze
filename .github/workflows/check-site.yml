name: Check live site

# Opens the published site in a browser and runs real postal code searches.
# Runs after each publish, every morning, and on demand.
on:
  workflow_run:
    workflows: ["Update data and publish site"]
    types: [completed]
  schedule:
    - cron: "17 23 * * *" # 07:17 Singapore time
  workflow_dispatch:
    inputs:
      url:
        description: "Site address to check (leave blank for the GitHub Pages address)"
        required: false

permissions:
  contents: read
  pages: read

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Find the site address
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          url="$INPUT_URL"
          if [ -z "$url" ]; then
            url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)
          fi
          echo "Checking $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install browser automation
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          google-chrome --version || npx playwright install --with-deps chromium

      - name: Check the site
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: node scripts/check_live_site.mjs "$SITE_URL" check-output

      - name: OneMap diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: |
          origin=$(echo "$SITE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          chrome="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
          headless="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) HeadlessChrome/141.0.0.0 Safari/537.36"
          probe() { # $1=postal $2=label $3=user agent
            : > /tmp/h
            start=$(date +%s%N)
            curl -s -m 10 -o /dev/null -D /tmp/h -A "$3" -H "Origin: $origin" \
              "https://www.onemap.gov.sg/api/common/elastic/search?searchVal=$1&returnGeom=Y&getAddrDetails=Y&pageNum=1"
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            printf '%s %-9s %5sms %s | acao=%s | %s\n' "$1" "$2" "$ms" "$(head -1 /tmp/h | tr -d '\r' || true)" \
              "$(grep -i '^access-control-allow-origin' /tmp/h | cut -d' ' -f2 | tr -d '\r' | paste -sd, -)" \
              "$(grep -iE '^(x-cache|server|age|via|retry-after|x-amz-cf-pop):' /tmp/h | tr -d '\r' | paste -sd' ' -)"
          }
          echo "== Spaced out, 2 s apart, normal Chrome user agent =="
          for pc in 791457 650116 690119 828629 529204 390087 129605 560507; do probe $pc chrome "$chrome"; sleep 2; done
          echo "== Same codes, headless Chrome user agent =="
          for pc in 791457 650116 690119 828629; do probe $pc headless "$headless"; sleep 2; done
          echo "== Burst, no pause =="
          for pc in 791457 650116 690119 828629 529204 390087 129605 560507 050034 793441; do probe $pc burst "$chrome"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: check-output
          retention-days: 14
