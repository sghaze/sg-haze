name: Watch for a new PA shelter list

# Every 3 hours, compare the list PA links on its Community Haze Shelters page
# with the one the site uses. When PA's list changes:
#   * if it reads cleanly and hasn't shrunk by more than 20%, it goes on the
#     site straight away, and an issue lists what changed for you to review;
#   * otherwise nothing is published, an issue explains why, and this run
#     fails so GitHub emails you. Run this workflow by hand with "Use PA's
#     latest list" ticked to publish it anyway.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Use PA's latest list on the site even if the automatic checks would hold it back"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: watch-pa
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Compare PA's list with the site's
        id: watch
        run: |
          set +e
          python scripts/watch_pa.py watch-output
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ -f watch-output/result.json ]; then
            r=watch-output/result.json
            echo "changed=$(jq -r .changed $r)" >> "$GITHUB_OUTPUT"
            echo "sha=$(jq -r .sha256 $r | cut -c1-12)" >> "$GITHUB_OUTPUT"
            # Safe to publish without a person looking first?
            safe=$(jq -r '(.readable == true) and ((.count // 0) >= 0.8 * (.previous_count // 1))' $r)
            echo "safe=$safe" >> "$GITHUB_OUTPUT"
            cat watch-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Alert that PA's page could not be checked
        if: steps.watch.outputs.exit != '0'
        run: |
          title="Could not check PA's haze shelter page"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The scheduled check couldn't read https://www.pa.gov.sg/our-network/community-clubs/shelters/ or find the list's PDF link on it. PA may have moved or redesigned the page. See the run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          echo "::error::Could not check PA's page. See the issue."
          exit 1

      - name: Put the new list on the site
        id: apply
        if: steps.watch.outputs.changed == 'true' && (steps.watch.outputs.safe == 'true' || github.event.inputs.apply == 'true')
        run: |
          cp watch-output/new.pdf data/source.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source.pdf
          git commit -m "Use PA's latest haze shelter list"
          # The publish workflow may have committed data since checkout.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          # Pushes made by this workflow don't start other workflows, so start
          # the publish workflow directly.
          gh workflow run site.yml --ref "$GITHUB_REF_NAME"
          commit=$(git rev-parse --short HEAD)
          for n in $(gh issue list --state open --label pa-list --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded: PA's latest list is now on the site ($commit)."
          done
          {
            echo "@${{ github.actor }} PA published a different list, and it is now on the site ($commit)."
            echo
            cat watch-output/summary.md
            echo
            echo "## Please check"
            echo
            echo "- In a few minutes, \`data/geocode-report.md\` lists any new shelter whose address and postal code disagree. Fixes go in \`CORRECTIONS\` in \`scripts/parse_pdf.py\`."
            echo "- The \"Check live site\" run that follows should pass; GitHub emails you if it doesn't."
            echo
            echo "Close this issue when you're done."
          } > body.md
          gh label create pa-list --color E99695 --description "PA published a different shelter list" --force
          gh issue create --title "PA's new shelter list is on the site (${{ steps.watch.outputs.sha }})" --body-file body.md --label pa-list

      - name: Alert that PA's new list needs a look before publishing
        if: steps.watch.outputs.changed == 'true' && steps.apply.outcome == 'skipped'
        run: |
          sha="${{ steps.watch.outputs.sha }}"
          existing=$(gh issue list --state open --search "$sha in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Already alerted in issue #$existing."
            exit 0
          fi
          {
            echo "@${{ github.actor }} PA published a different list, but it was **not** put on the site automatically: either it couldn't be read, or it has over 20% fewer shelters than the site. See below."
            echo
            cat watch-output/summary.md
            echo
            echo "## To use it anyway"
            echo
            echo "Open **Actions → Watch for a new PA shelter list → Run workflow**, tick **Use PA's latest list**, and click **Run workflow**. If the list couldn't be read, the parser needs updating first."
          } > body.md
          gh label create pa-list --color E99695 --description "PA published a different shelter list" --force
          gh issue create --title "New PA haze shelter list needs a look ($sha)" --body-file body.md --label pa-list
          echo "::error::PA has published a different shelter list that wasn't published automatically. See the new issue."
          exit 1
