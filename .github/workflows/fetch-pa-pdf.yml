name: Fetch PA's current list for inspection (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download PA's current list onto the pa-latest branch
        run: |
          python scripts/watch_pa.py out || true
          ls -la out
          head -c 8 out/new.pdf; echo
          mkdir pa && cp out/new.pdf pa/pa-latest.pdf && cd pa
          git init -q -b pa-latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pa-latest.pdf
          git commit -q -m "PA's current haze shelter list (for inspection)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pa-latest
